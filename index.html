<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="icon" href="images/favicon.ico" />
    <title>Radiant - Close every deal</title>

    <style type="text/tailwindcss">
      @theme {
        --font-switzer: "Switzer", sans-serif;
        --color-peach: #fff1be;
        --color-pink: #d77cde;
        --color-text: #030712;
        --color-grey: #555;
      }

      @font-face {
        font-family: "Switzer";
        src: url(fonts/Switzer-Medium.otf);
      }
    </style>
  </head>

  <body class="text-text font-switzer">
    <header>
      <section
        class="my-4 mx-auto h-[754px] max-w-[1700px] w-full rounded-2xl bg-linear-to-r from-peach to-pink py-16 px-32"
      >
        <div class="flex justify-between items-center gap-5 text-3xl">
          <div class="pt-3 flex gap-5 items-center justify-center">
            <img class="size-8" src="images/favicon.ico" alt="" />
            <p>Radiant</p>
            <div
              class="flex items-center gap-5 rounded-full bg-fuchsia-950/35 px-3 py-1 text-base text-white hover:bg-gray-950 hover:cursor-pointer duration-500"
            >
              <p class=" ">
                Radiant raises $100M Series A from Tailwind Ventures
              </p>
              <img class="size-3 invert" src="images/right-arrow.png" alt="" />
            </div>
          </div>
          <div class="flex gap-12">
            <a class="hover:text-grey" href="">Pricing</a>
            <a class="hover:text-grey" href="#">Company</a>
            <a class="hover:text-grey" href="#">Blog</a>
            <a class="hover:text-grey" href="#">Login</a>
          </div>
        </div>

        <h1 class="pt-37 text-9xl">Close every deal.</h1>
        <p class="mt-8 text-2xl text-gray-950/75">
          Radiant helps you sell more by revealing
          <br />
          sensitive information about your customers.
        </p>

        <div class="mt-17 flex gap-5">
          <button
            class="rounded-2xl bg-gray-950 px-4 py-2 text-[#fff] hover:cursor-pointer hover:bg-[#555]"
          >
            Get started
          </button>
          <button
            class="rounded-2xl px-4 py-2 shadow-md ring-2 shadow-black ring-[#fff] hover:cursor-pointer hover:ring-[#555]"
          >
            See pricing
          </button>
        </div>
      </section>
      <section
        class="mx-50 flex justify-center gap-35 hover:cursor-pointer my-9"
      >
        <img
          class="w-33"
          src="images/brands/savvycal.svg"
          alt="savvycal icon"
        />
        <img
          class="w-33"
          src="images/brands/laravel.svg"
          alt="laravel svg icon"
        />
        <img class="w-33" src="images/brands/tuple.svg" alt="tuple icon" />
        <img
          class="w-33"
          src="images/brands/transistor.svg"
          alt="transitor icon"
        />
        <img
          class="w-33"
          src="images/brands/statamic.svg"
          alt="statamic icon"
        />
      </section>

      <section class="mx-auto max-w-7xl flex-col items-center justify-center">
        <h2 class="max-w-3xl text-gray-950 text-6xl font-medium mt-22">
          A snapshot of your entire sales pipeline.
        </h2>

        <img
          class="my-12 mx-auto ring-2 ring-black/10 ring-offset-5 rounded-2xl"
          src="images/app.png"
          alt=""
        />
      </section>
      <!-- ---------------------------------------------------- -->
      <section class="mx-auto max-w-7xl flex-col items-center justify-center">
        <h2 class="max-w-3xl text-gray-950 text-6xl font-medium mt-22 relative">
          <p
            class="absolute -translate-y-10 text-gray-400 text-xs/5 font-bold uppercase"
          >
            Sales
          </p>
          Know more about your customers than they do.
        </h2>

        <div class="flex gap-8 my-9">
          <div
            class="p-7 rounded-2xl w-[671px] h-[511px] overflow-hidden relative"
          >
            <img
              class=" inset w-full h-full object-cover scale-[1.7] relative absolute translate-y-[5%]"
              src="images/profile.png"
              alt=""
            />
            <div
              class="absolute inset-0 bg-gradient-to-t from-white to-transparent z-10"
            ></div>

            <!-- <div class="relative z-20 flex flex-col gap-4 mb-6">
              <p class="font-bold text-sm absolute top-0 -translate-y-full">
                INSIGHT
              </p>
              <h3 class="font-bold text-2xl">Get perfect clarity</h3>
              <p class="text-grey">
                Radiant uses social engineering to build a detailed financial
                picture of your leads. Know their budget, compensation package,
                social security number, and more.
              </p>
            </div>
          </div>
          <div class="card">
            <img class="card-img img-2" src="images/competitors.png" alt="" />
            <!-- <h3>Undercut your competitors</h3>
      <p>With our advanced data mining, you’ll know which companies your leads are talking to and exactly how much they’re being charged.</p> --> -->
          </div>
        </div>
      </section>
    </header>
  </body>
</html>
