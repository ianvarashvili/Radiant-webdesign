<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Radiant - Close every deal</title>
    <style>
      :root {
        --peach: #fff1be;
        --pink: #d77cde;
        /* --text: var(--color-gray-950); */
      }
    </style>
  </head>

  <body>
    <header>
      <section class="color-gray-950 m-[15px] h-[754px] w-[full] rounded-2xl bg-linear-to-r from-[var(--peach)] to-[var(--pink)] p-[66px]">
        <div class="flex justify-between gap-[20px] text-[28px]">
          <div>Radiant</div>
          <div class="flex gap-[50px]">
            <a class="hover:text-[#555]" href="">Pricing</a>
            <a class="hover:text-[#555]" href="#">Company</a>
            <a class="hover:text-[#555]" href="#">Blog</a>
            <a class="hover:text-[#555]" href="#">Login</a>
          </div>
        </div>

        <h1 class="mt-[70px] text-9xl">Close every deal.</h1>
        <p class="mt-[32px] text-[24px]">
          Radiant helps you sell more by revealing
          <br />
          sensitive information about your customers.
        </p>

        <div class="mt-[70px] flex gap-[20px]">
          <button class="rounded-2xl bg-gray-950 px-[16px] py-[7px] text-[#fff] hover:cursor-pointer hover:bg-[#555]">Get started</button>
          <button class="rounded-2xl px-[16px] py-[7px] shadow-md ring-2 shadow-black ring-[#fff] hover:cursor-pointer hover:ring-[#555]">See pricing</button>
        </div>
      </section>
      <section class=" mx-[200px]  flex justify-center gap-28 hover:cursor-pointer my-[36px]">6
        <img class="w-[200px]" src="images/brands/savvycal.svg" alt="savvycal icon" />
        <img class="w-[200px]" src="images/brands/laravel.svg" alt="laravel svg icon" />
        <img class="w-[200px]" src="images/brands/tuple.svg" alt="tuple icon" />
        <img class="w-[200px]" src="images/brands/transistor.svg" alt="transitor icon" />
        <img class="w-[200px]" src="images/brands/statamic.svg" alt="statamic icon" />
      </section>

      <section class="mx-[200px] w-3xl flex-col items-center justify-center">
        <h2 class="text-gray-950 text-6xl font-medium mt-[90px] " >A snapshot of your entire <br> sales pipeline.</h2>

        <img class="w-[1000px] my-[50px] mx-auto shadow-[0_0_20px_5px_rgba(0,0,0,0.3)]" src="images/app.png" alt="">
      </section>
    </header>
  </body>
</html>
